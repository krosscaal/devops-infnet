# .github/workflows/ci-deploy.yml
name: CI/CD — Guia Infnet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: krossbykrossft/guia-infnet

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build e Push da imagem no Docker Hub
  # ─────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Hub
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔑 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extrair tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build e Push
        uses: docker/build-push-action@v5
        with:
          context: ./guia-infnet
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 2 — Deploy no Kubernetes
  # Só executa no push para main (não em PRs)
  # ─────────────────────────────────────────────
  deploy:
    name: ☸️ Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🛠️ Configurar kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: 🔐 Configurar kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: 🚀 Aplicar manifests — Prometheus
        run: kubectl apply -f k8s/prometheus.yaml

      - name: 🚀 Aplicar manifests — Aplicação, Redis e Grafana
        run: kubectl apply -f k8s/deploy.yaml

      - name: ⏳ Aguardar rollout da aplicação
        run: |
          kubectl rollout status deployment/guia-infnet --timeout=180s
          kubectl rollout status deployment/redis       --timeout=120s
          kubectl rollout status deployment/prometheus  --timeout=120s
          kubectl rollout status deployment/grafana     --timeout=120s

      - name: 🔄 Forçar atualização da imagem (latest)
        run: |
          kubectl set image deployment/guia-infnet \
            guia-infnet=${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            --record || true

      - name: 📋 Resumo pós-deploy
        run: |
          echo "===== Pods ====="
          kubectl get pods -n default -o wide
          echo "===== Services ====="
          kubectl get services -n default
          echo "===== PVC ====="
          kubectl get pvc -n default